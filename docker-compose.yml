name: my-website

services:
  # 1. تطبيق الويب
  web:
    build: .
    ports:
      - "8080:80"
    restart: always

  # 2. قاعدة البيانات
  database:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydatabase
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  # 3. لوحة المراقبة والتحليل (Monitoring)
  monitoring:
    image: netdata/netdata
    container_name: netdata
    hostname: example.com
    ports:
      - "19999:19999"
    cap_add:
      - SYS_PTRACE
    security_opt:
      - apparmor:unconfined
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  db_data: